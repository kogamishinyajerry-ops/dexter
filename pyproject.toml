[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astock-advisor"
version = "1.0.0"
description = "AI-powered A-Share stock market investment advisor"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.7",
    "langchain-openai>=1.0.3",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.4.34",
    "openai>=2.2.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.11.10",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "akshare>=1.13.0",
    "tushare>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
]

[project.scripts]
astock-agent = "astock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
